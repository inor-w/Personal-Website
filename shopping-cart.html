<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Inor's Shopping Cart</title>
<link rel="stylesheet" href="assets/css/bootstrap.css">
</head>

<body>
    <div class="row">
        <div class="col-md-12">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <h3 class="panel-title">Shopping Cart Items: <span id="counter">0</span></h3>
                </div>
                <div class="panel-body" id="list">
                </div>
                <div class="panel-footer">
                    <input type="text" id="usrInput">
                    <button id="addToList" type="button" class="btn btn-primary">Add Item</button>
                </div>
            </div>
        </div>
    </div>              
</body>
</html>
<script src="assets/js/shopping-cart.js"></script>
