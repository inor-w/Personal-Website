<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Inor's JavaScript Test</title>
<link href="assets/css/bootstrap.css" rel="stylesheet">
</head>
<body>
<div id="page">
	<h1>Inor's Login Page</h1>
	<h2>New Account</h2>
	<div class="form-group" id="unGroup">
		<label class="control-label" for="username">Create a username:</label>
		<input class="form-control" type="text" id="username"/>
		<span id="unFeedback" class="help-block"></span>
	</div>
	<div class="form-group" id="pwdGroup">
		<label class="control-label" for="password">Create a password:</label>
		<input class="form-control" type="password" id="password"/>
		<span id="pwdFeedback" class="help-block"></span>
	</div>
	<hr>
	<input class="btn btn-success" type="submit" value="Sign Up!"/>
</div>
<script src="assets/js/event-listener.js"></script>
</body>
</html>
